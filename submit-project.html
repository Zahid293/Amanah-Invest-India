<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Submit Project | Amanah Invest India</title>

<link rel="stylesheet" href="css/style.css">

<style>

.container{

width:90%;

max-width:1000px;

margin:50px auto;

background:white;

padding:40px;

border-radius:12px;

box-shadow:0 5px 20px rgba(0,0,0,.1);

}

.container h1{

text-align:center;

color:#0F5132;

margin-bottom:15px;

}

.container p{

text-align:center;

margin-bottom:35px;

color:#666;

}

.row{

display:grid;

grid-template-columns:1fr 1fr;

gap:20px;

margin-bottom:20px;

}

.form-group{

display:flex;

flex-direction:column;

}

label{

font-weight:bold;

margin-bottom:8px;

}

input,
select,
textarea{

padding:12px;

border:1px solid #ccc;

border-radius:6px;

font-size:16px;

}

textarea{

height:150px;

resize:vertical;

}

@media(max-width:768px){

.row{

grid-template-columns:1fr;

}

}

</style>

</head>

<body>

<header>

<nav>

<div class="logo">

<h2>Amanah Invest India</h2>

</div>

<ul>

<li><a href="index.html">Home</a></li>

<li><a href="projects.html">Projects</a></li>

<li><a href="register.html">Register</a></li>

<li><a href="login.html">Login</a></li>

</ul>

</nav>

</header>

<div class="container">

<h1>Submit Your Project</h1>

<p>

Complete the form below to submit your project for review.

</p>

<form>
<div class="row">

<div class="form-group">
<label>Project Title</label>
<input type="text" placeholder="Enter project title">
</div>

<div class="form-group">
<label>Project Category</label>
<select>
<option>Commercial Building</option>
<option>Shopping Mall</option>
<option>Agriculture</option>
<option>Healthcare</option>
<option>Education</option>
<option>Industrial</option>
<option>Renewable Energy</option>
</select>
</div>

</div>

<div class="row">

<div class="form-group">
<label>Project Location</label>
<input type="text" placeholder="City, State">
</div>

<div class="form-group">
<label>Estimated Project Cost (₹)</label>
<input type="number" placeholder="Enter estimated cost">
</div>

</div>

<div class="row">

<div class="form-group">
<label>Expected Project Duration</label>
<input type="text" placeholder="e.g. 24 Months">
</div>

<div class="form-group">
<label>Current Project Stage</label>
<select>
<option>Concept</option>
<option>Planning</option>
<option>Land Acquired</option>
<option>Construction Started</option>
<option>Expansion</option>
</select>
</div>

</div>

<div class="form-group">

<label>Project Description</label>

<textarea placeholder="Describe your project, objectives and expected outcomes"></textarea>

</div>

<div class="form-group">

<label>Upload Project Proposal (UI Only)</label>

<input type="file">

</div>

<div class="form-group">

<input type="checkbox">

I confirm that the information provided is accurate to the best of my knowledge.

</div>

<div style="text-align:center;margin-top:30px;">

<button type="submit" class="btn">

Submit Project for Review

</button>

</div>

</form>

</div>

<footer>

<p>
© 2026 Amanah Invest India. All Rights Reserved.
</p>

</footer>

</body>

</html>
